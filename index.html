<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: linear-gradient(135deg, #ffd6df, #ff9fb2);
    text-align: center;
}

.card {
    background: white;
    padding: 35px 20px;
    border-radius: 25px;
    width: 85%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

h1 {
    color: #ff4d6d;
}

button {
    border: none;
    padding: 13px 25px;
    margin: 10px;
    border-radius: 25px;
    font-size: 17px;
    font-weight: bold;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #eee;
    position: relative;
}

#result {
    display: none;
    font-size: 25px;
    font-weight: bold;
    color: #ff4d6d;
}
</style>
</head>

<body>

<div class="card" id="question">

    <div style="font-size:60px;">🥹</div>

    <h1>Sorry kagabi babi. Bati na tayo babi?🥹</h1>

    <button id="yes">YES ❤️</button>
    <button id="no">NO 😭</button>

</div>

<div class="card" id="result">

    <div style="font-size:60px;">❤️</div>

    <p>Yeeeey!! i love you ❤️</p>

</div>

<script>

const no = document.getElementById("no");

no.onclick = function() {

    no.innerHTML = "Please 🥺";

    const x = Math.random() * 200 - 100;
    const y = Math.random() * 150 - 75;

    no.style.transform =
        "translate(" + x + "px, " + y + "px)";
};

document.getElementById("yes").onclick = function() {

    document.getElementById("question").style.display = "none";

    document.getElementById("result").style.display = "block";

};

</script>

</body>
</html>
